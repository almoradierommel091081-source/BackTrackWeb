spring.application.name=BackTrackWeb

# ---------------------------------------------------------------
# Database (PostgreSQL)
# Set these as environment variables before running the system.
# Example: DB_URL=jdbc:postgresql://localhost:5432/backtrack
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backtrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# The schema is managed by Flyway (src/main/resources/db/migration).
# Hibernate only checks that the tables match the entities and never changes
# them. Set DB_DDL_AUTO=update only as an emergency escape hatch.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:validate}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------
# Database migrations (Flyway)
# A database that already has BackTrack tables is adopted at baseline
# version 1: V1 is recorded as applied and is not executed, so existing
# data is never touched. Set DB_MIGRATIONS=false only to troubleshoot.
# ---------------------------------------------------------------
spring.flyway.enabled=${DB_MIGRATIONS:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=8h

# Clickjacking protection: pages cannot be embedded in a frame by default.
# Set APP_ALLOW_FRAMES=true ONLY when running a local preview that shows the
# app inside an iframe. Never enable it on a real public deployment.
app.security.allow-frames=${APP_ALLOW_FRAMES:false}

# ---------------------------------------------------------------
# First-run owner account (only used when the users table is empty)
# If APP_OWNER_PASSWORD is not set, a random password is generated
# and printed once in the startup log.
# ---------------------------------------------------------------
app.owner.username=${APP_OWNER_USERNAME:owner}
app.owner.password=${APP_OWNER_PASSWORD:}
app.owner.full-name=${APP_OWNER_FULL_NAME:Business Owner}
