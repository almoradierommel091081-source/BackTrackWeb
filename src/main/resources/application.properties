spring.application.name=BackTrackWeb

# ---------------------------------------------------------------
# Database (PostgreSQL)
# Set these as environment variables before running the system.
# Example: DB_URL=jdbc:postgresql://localhost:5432/backtrack
# ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/backtrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate only ADDS missing tables/columns. It never drops data.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------
# Server
# ---------------------------------------------------------------
server.port=${PORT:8080}
server.servlet.session.tracking-modes=cookie
server.servlet.session.timeout=8h

# Clickjacking protection: pages cannot be embedded in a frame by default.
# Set APP_ALLOW_FRAMES=true ONLY when running a local preview that shows the
# app inside an iframe. Never enable it on a real public deployment.
app.security.allow-frames=${APP_ALLOW_FRAMES:false}

# ---------------------------------------------------------------
# First-run owner account (only used when the users table is empty)
# If APP_OWNER_PASSWORD is not set, a random password is generated
# and printed once in the startup log.
# ---------------------------------------------------------------
app.owner.username=${APP_OWNER_USERNAME:owner}
app.owner.password=${APP_OWNER_PASSWORD:}
app.owner.full-name=${APP_OWNER_FULL_NAME:Business Owner}
