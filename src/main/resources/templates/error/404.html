<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b1730">
    <title>BackTrack - Not found</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<main class="error-page">
    <div class="error-card">
        <img src="/images/backtrack-logo.png" alt="BackTrack">
        <div class="error-code">404</div>
        <h1 th:text="${message} ?: 'We could not find that record'">We could not find that record</h1>
        <p>It may have been removed, or the link is wrong.</p>
        <div class="error-actions">
            <a class="btn btn-primary" th:href="@{/dashboard}">Back to dashboard</a>
            <a class="btn btn-secondary" th:href="@{/products}">Products</a>
        </div>
    </div>
</main>

</body>
</html>
