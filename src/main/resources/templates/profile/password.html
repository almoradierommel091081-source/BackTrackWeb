<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My password')}"></head>

<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('profile')}"></aside>

    <main class="main-content">

        <header th:replace="~{fragments/layout :: topbar('My password', 'Change the password for your own account')}"></header>

        <div th:replace="~{fragments/layout :: flash}"></div>

        <form class="form-card" method="post" th:action="@{/profile/password}" th:object="${passwordChangeForm}">

            <div class="alert alert-error" th:if="${#fields.hasAnyErrors()}">
                Please check the fields below.
            </div>

            <div class="field">
                <label for="currentPassword">Current password *</label>
                <input type="password" id="currentPassword" th:field="*{currentPassword}"
                       autocomplete="current-password">
                <span class="error-text" th:if="${#fields.hasErrors('currentPassword')}"
                      th:errors="*{currentPassword}"></span>
            </div>

            <div class="field">
                <label for="newPassword">New password *</label>
                <input type="password" id="newPassword" th:field="*{newPassword}"
                       autocomplete="new-password">
                <span class="hint">At least 8 characters.</span>
                <span class="error-text" th:if="${#fields.hasErrors('newPassword')}"
                      th:errors="*{newPassword}"></span>
            </div>

            <div class="field">
                <label for="confirmPassword">Repeat new password *</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                       autocomplete="new-password">
                <span class="error-text" th:if="${#fields.hasErrors('confirmPassword')}"
                      th:errors="*{confirmPassword}"></span>
            </div>

            <div class="form-actions">
                <button class="btn btn-primary" type="submit">Change password</button>
                <a class="btn btn-secondary" th:href="@{/dashboard}">Cancel</a>
            </div>

        </form>

    </main>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
